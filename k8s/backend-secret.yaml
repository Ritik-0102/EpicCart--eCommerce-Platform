# Secret template holding sensitive credentials as placeholders for demonstration
# In a real production cluster, secrets are created with "kubectl create secret generic"
apiVersion: v1
kind: Secret
metadata:
  name: epiccart-backend-secret
  labels:
    app.kubernetes.io/name: epiccart
    app.kubernetes.io/component: backend
type: Opaque
# stringData allows writing plain text in YAML; Kubernetes automatically base64-encodes it
stringData:
  # Database connection string placeholder (Neon serverless PostgreSQL with SSL)
  DATABASE_URL: "postgresql://username:password@ep-placeholder.eu-central-1.aws.neon.tech/epiccart?sslmode=require"
  # JWT signing key placeholder (must be at least 32 characters in production)
  JWT_SECRET: "placeholder_jwt_secret_min_32_characters_for_signing"
  # Razorpay API key ID placeholder
  RAZORPAY_KEY_ID: "rzp_test_placeholder"
  # Razorpay private key secret placeholder for HMAC signature verification
  RAZORPAY_KEY_SECRET: "placeholder_razorpay_secret"
  # Cloudinary media storage credentials placeholders
  CLOUDINARY_CLOUD_NAME: "placeholder_cloud"
  CLOUDINARY_API_KEY: "placeholder_key"
  CLOUDINARY_API_SECRET: "placeholder_secret"
  # One-time bootstrap secret to create the initial admin account
  ADMIN_BOOTSTRAP_SECRET: "placeholder_bootstrap_secret"
  # SMTP mail user and password placeholders
  EMAIL_USER: "placeholder_user"
  EMAIL_PASS: "placeholder_pass"
