# Deployment manages 2 replicated Nginx frontend Pods serving the React SPA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epiccart-frontend
  labels:
    app.kubernetes.io/name: epiccart
    app.kubernetes.io/component: frontend
spec:
  # Maintain 2 replicas so the storefront stays available even if one Pod restarts
  replicas: 2
  selector:
    matchLabels:
      app: epiccart-frontend
  # Pod template: defines how each frontend Pod is constructed
  template:
    metadata:
      labels:
        app: epiccart-frontend
        app.kubernetes.io/name: epiccart
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          # Image built from frontend/Dockerfile (contains Nginx + compiled React assets)
          image: epiccart-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            # Nginx container listens on standard HTTP port 80
            - containerPort: 80
              name: http
          # Resource requests and limits for the lightweight Nginx web server
          resources:
            requests:
              cpu: 50m       # 0.05 CPU core minimum
              memory: 64Mi   # 64MB RAM minimum
            limits:
              cpu: 250m      # 0.25 CPU core maximum
              memory: 256Mi  # 256MB RAM maximum ceiling
          # Readiness probe: verifies Nginx is serving the root index.html page
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          # Liveness probe: restarts Nginx if the web server process crashes
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
