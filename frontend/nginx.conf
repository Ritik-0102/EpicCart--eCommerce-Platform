# Configure the Nginx web server block
server {
    # Listen on port 80 for standard HTTP web traffic
    listen 80;
    server_name localhost;

    # Handle all incoming browser page requests
    location / {
        # The directory inside the container holding our compiled Vite assets
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # Single Page Application routing fallback:
        # Check if the requested file exists ($uri) or directory exists ($uri/).
        # If not, send /index.html so React Router can render the correct page client-side.
        try_files $uri $uri/ /index.html;
    }

    # Static error page handling if Nginx encounters a 50x server issue
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
